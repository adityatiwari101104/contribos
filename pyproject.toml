[project]
name = "contribos"
version = "0.2.4"
description = "Get trusted, get merged, come back: a guide for new open-source contributors in the AI era."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
keywords = ["open-source", "contributors", "github", "mcp", "ai-policy", "good-first-issue", "onboarding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://contribos-iota.vercel.app/"
Source = "https://github.com/adityatiwari101104/contribos"
Issues = "https://github.com/adityatiwari101104/contribos/issues"

[project.scripts]
contribos = "contribos.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contribos"]
